<meta charset="UTF-8">
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>달빛카페 메뉴판</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Noto Sans KR", sans-serif;
    background: #1b2238;
    color: #f4efe3;
    min-height: 100vh;
    padding: 32px 20px 48px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 32px; }
  .moon {
    width: 56px; height: 56px; margin: 0 auto 14px;
    border-radius: 50%;
    background: #f6e7b4;
    box-shadow: 0 0 28px rgba(246, 231, 180, .45);
    position: relative; overflow: hidden;
  }
  .moon::after {
    content: ""; position: absolute;
    top: -6px; left: 18px; width: 50px; height: 50px;
    border-radius: 50%; background: #1b2238; /* 초승달 */
  }
  h1 { font-size: 26px; letter-spacing: 2px; color: #f6e7b4; }
  .sub { font-size: 13px; opacity: .65; margin-top: 6px; }
  .menu { list-style: none; }
  .item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 20px; margin-bottom: 12px;
    background: #252e4a;
    border: 1px solid rgba(246, 231, 180, .15);
    border-radius: 14px;
  }
  .name { font-size: 17px; font-weight: 600; }
  .price { font-size: 17px; color: #f6e7b4; font-weight: 700; }
  .cat {
    font-size: 12px; letter-spacing: 1px; opacity: .55;
    margin: 24px 4px 10px;
  }
  footer { text-align: center; font-size: 12px; opacity: .45; margin-top: 28px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="moon"></div>
      <h1>달빛카페</h1>
      <p class="sub">Moonlight Cafe · MENU</p>
    </header>

    <p class="cat">COFFEE</p>
    <ul class="menu">
      <li class="item"><span class="name">아메리카노</span><span class="price">3,500원</span></li>
      <li class="item"><span class="name">카페라떼</span><span class="price">4,000원</span></li>
    </ul>

    <p class="cat">DESSERT</p>
    <ul class="menu">
      <li class="item"><span class="name">딸기케이크</span><span class="price">5,500원</span></li>
    </ul>

    <footer>오늘도 달빛 아래 좋은 시간 보내세요</footer>
  </div>
</body>
</html>
